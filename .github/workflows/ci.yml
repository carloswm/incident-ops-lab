name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Enforce npm as package manager
        run: |
          if [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "This project uses npm; remove yarn.lock or pnpm-lock.yaml."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Start application stack
        run: docker compose up --build --detach --wait --wait-timeout 60

      - name: Check API readiness
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:3000/health/ready

      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
