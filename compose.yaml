services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    volumes:
      - incident-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://incidents:incidents@db:5432/incidents
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  incident-data:
